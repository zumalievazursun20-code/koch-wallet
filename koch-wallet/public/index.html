<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Koch Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f1a;
      --bg2: #121826;
      --card: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99,102,241,0.4);
      --accent: #22d3ee;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Background effects */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34,211,238,0.12), transparent);
      pointer-events: none;
      z-index: 0;
    }
    #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding-bottom: 90px; min-height: 100vh; }

    /* Header */
    .header {
      padding: 20px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px var(--primary-glow);
    }
    .logo-icon svg { width: 20px; height: 20px; color: white; }

    /* Balance card */
    .balance-card {
      margin: 8px 16px 20px;
      padding: 28px 24px;
      background: linear-gradient(145deg, rgba(99,102,241,0.2), rgba(34,211,238,0.08));
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }
    .balance-card::after {
      content: '';
      position: absolute;
      top: -50%; right: -30%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(34,211,238,0.2), transparent 70%);
      pointer-events: none;
    }
    .balance-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    .balance-amount {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }
    .balance-currency { font-size: 1.1rem; font-weight: 600; opacity: 0.7; margin-left: 4px; }
    .user-info { margin-top: 14px; font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
    .badge-admin {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* Quick actions */
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 16px 24px;
    }
    .action-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn .icon-wrap {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .action-btn .icon-wrap svg { width: 22px; height: 22px; }
    .action-btn.loan .icon-wrap { background: rgba(99,102,241,0.2); color: #a5b4fc; }
    .action-btn.history .icon-wrap { background: rgba(34,211,238,0.15); color: #22d3ee; }
    .action-btn.admin .icon-wrap { background: rgba(245,158,11,0.2); color: #fbbf24; }

    /* Sections */
    .section { padding: 0 16px 20px; }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .card-title { font-weight: 600; font-size: 0.95rem; }
    .card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
    .amount-pos { color: var(--success); font-weight: 700; }
    .amount-neg { color: var(--danger); font-weight: 700; }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
    .status-active { background: rgba(16,185,129,0.2); color: #34d399; }
    .status-approved { background: rgba(99,102,241,0.2); color: #a5b4fc; }
    .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
    .status-repaid { background: rgba(148,163,184,0.2); color: #94a3b8; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(11,15,26,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 max(10px, env(safe-area-inset-bottom));
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: 12px;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item svg { width: 24px; height: 24px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg2);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 20px 40px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-input::placeholder { color: #64748b; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 20px var(--primary-glow);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger {
      background: rgba(244,63,94,0.15);
      color: #fb7185;
      border: 1px solid rgba(244,63,94,0.3);
    }
    .btn-success {
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    .btn-sm { padding: 10px 16px; font-size: 0.85rem; width: auto; border-radius: 10px; }

    /* Empty */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

    /* Admin panels */
    .admin-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
    }
    .stat-value { font-size: 1.3rem; font-weight: 800; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: rgba(99,102,241,0.2);
      border-color: var(--primary);
      color: #a5b4fc;
    }

    .search-box {
      margin-bottom: 16px;
    }

    .loading {
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--bg2);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 300;
      transition: transform 0.3s;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        </div>
        Koch Wallet
      </div>
    </div>

    <!-- Main content screens -->
    <div id="screen-home">
      <div class="balance-card">
        <div class="balance-label">Ваш баланс</div>
        <div class="balance-amount" id="balance">0.00<span class="balance-currency">USD</span></div>
        <div class="user-info">
          <span id="user-name">—</span>
          <span class="badge-admin hidden" id="admin-badge">Admin</span>
        </div>
      </div>

      <div class="actions">
        <button class="action-btn loan" onclick="openLoanModal()">
          <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          Кредит
        </button>
        <button class="action-btn history" onclick="showScreen('history')">
          <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          </div>
          История
        </button>
        <button class="action-btn admin hidden" id="admin-btn" onclick="showScreen('admin')">
          <div class="icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
          </div>
          Админ
        </button>
      </div>

      <div class="section">
        <div class="section-title">
          Активные кредиты
          <span id="loans-count"></span>
        </div>
        <div id="active-loans"></div>
      </div>
    </div>

    <div id="screen-history" class="hidden">
      <div class="section" style="padding-top: 8px;">
        <div class="section-title">История операций</div>
        <div id="tx-list"></div>
      </div>
    </div>

    <div id="screen-loans" class="hidden">
      <div class="section" style="padding-top: 8px;">
        <div class="section-title">Мои кредиты</div>
        <div id="all-loans"></div>
      </div>
    </div>

    <div id="screen-admin" class="hidden">
      <div class="section" style="padding-top: 8px;">
        <div class="section-title">Админ-панель</div>
        <div class="admin-stats" id="admin-stats"></div>
        <div class="tabs">
          <div class="tab active" data-tab="users" onclick="switchAdminTab('users')">Пользователи</div>
          <div class="tab" data-tab="loans" onclick="switchAdminTab('loans')">Заявки</div>
        </div>
        <div id="admin-users">
          <div class="search-box">
            <input class="form-input" id="user-search" placeholder="Поиск по ID, имени..." oninput="searchUsers()" />
          </div>
          <div id="users-list"></div>
        </div>
        <div id="admin-loans" class="hidden">
          <div id="pending-loans"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" data-screen="home" onclick="showScreen('home')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Главная
    </div>
    <div class="nav-item" data-screen="loans" onclick="showScreen('loans')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      Кредиты
    </div>
    <div class="nav-item" data-screen="history" onclick="showScreen('history')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      История
    </div>
  </div>

  <!-- Loan Modal -->
  <div class="modal-overlay" id="loan-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Заявка на кредит</div>
      <div class="form-group">
        <label class="form-label">Сумма (USD)</label>
        <input type="number" class="form-input" id="loan-amount" placeholder="От 10 до 100 000" min="10" max="100000" />
      </div>
      <div class="form-group">
        <label class="form-label">Срок (дней)</label>
        <input type="number" class="form-input" id="loan-term" placeholder="7–365" value="30" min="7" max="365" />
      </div>
      <div class="form-group">
        <label class="form-label">Цель (необязательно)</label>
        <input type="text" class="form-input" id="loan-purpose" placeholder="Например: ремонт" maxlength="100" />
      </div>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:16px;">
        Процентная ставка: <strong style="color:#a5b4fc">5%</strong> (может быть изменена админом при одобрении)
      </p>
      <button class="btn btn-primary" onclick="submitLoan()">Подать заявку</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="closeModal('loan-modal')">Отмена</button>
    </div>
  </div>

  <!-- Repay Modal -->
  <div class="modal-overlay" id="repay-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Погашение кредита</div>
      <p style="color:var(--text-muted);margin-bottom:16px;font-size:0.9rem" id="repay-info"></p>
      <div class="form-group">
        <label class="form-label">Сумма погашения</label>
        <input type="number" class="form-input" id="repay-amount" placeholder="Сумма" />
      </div>
      <button class="btn btn-primary" onclick="submitRepay()">Погасить</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="closeModal('repay-modal')">Отмена</button>
    </div>
  </div>

  <!-- Adjust Balance Modal -->
  <div class="modal-overlay" id="adjust-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Изменить баланс</div>
      <p style="color:var(--text-muted);margin-bottom:16px;font-size:0.9rem" id="adjust-user-info"></p>
      <div class="form-group">
        <label class="form-label">Сумма (+ зачислить / − списать)</label>
        <input type="number" class="form-input" id="adjust-amount" placeholder="Например: 100 или -50" step="0.01" />
      </div>
      <div class="form-group">
        <label class="form-label">Причина</label>
        <input type="text" class="form-input" id="adjust-reason" placeholder="Комментарий" maxlength="200" />
      </div>
      <button class="btn btn-primary" onclick="submitAdjust()">Применить</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="closeModal('adjust-modal')">Отмена</button>
    </div>
  </div>

  <!-- Approve Loan Modal -->
  <div class="modal-overlay" id="approve-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Одобрить кредит</div>
      <p style="color:var(--text-muted);margin-bottom:16px;font-size:0.9rem" id="approve-info"></p>
      <div class="form-group">
        <label class="form-label">Процентная ставка (%)</label>
        <input type="number" class="form-input" id="approve-rate" value="5" min="0" max="100" step="0.1" />
      </div>
      <button class="btn btn-success" onclick="decideLoan('approve')">Одобрить и выдать</button>
      <button class="btn btn-danger" style="margin-top:10px" onclick="decideLoan('reject')">Отклонить</button>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="closeModal('approve-modal')">Отмена</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== STATE ==========
    let currentUser = null;
    let currentLoanId = null;
    let currentAdjustUserId = null;
    let currentApproveLoanId = null;
    const tg = window.Telegram?.WebApp;

    // ========== INIT ==========
    async function init() {
      if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0b0f1a');
        tg.setBackgroundColor('#0b0f1a');
      }
      await loadMe();
    }

    function getInitData() {
      return tg?.initData || '';
    }

    async function api(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': getInitData()
      };
      const res = await fetch('/api' + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
      return data;
    }

    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ========== LOAD DATA ==========
    async function loadMe() {
      try {
        currentUser = await api('/me');
        document.getElementById('balance').innerHTML = formatMoney(currentUser.balance) + '<span class="balance-currency">USD</span>';
        const name = [currentUser.first_name, currentUser.last_name].filter(Boolean).join(' ') || currentUser.username || 'ID ' + currentUser.id;
        document.getElementById('user-name').textContent = name;
        if (currentUser.is_admin) {
          document.getElementById('admin-badge').classList.remove('hidden');
          document.getElementById('admin-btn').classList.remove('hidden');
        }
        renderActiveLoans(currentUser.loans || []);
      } catch (e) {
        console.error(e);
        // Dev fallback
        if (!getInitData()) {
          document.getElementById('balance').innerHTML = '0.00<span class="balance-currency">USD</span>';
          document.getElementById('user-name').textContent = 'Откройте через Telegram';
        }
      }
    }

    function formatMoney(n) {
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderActiveLoans(loans) {
      const el = document.getElementById('active-loans');
      const active = loans.filter(l => ['pending', 'active', 'approved'].includes(l.status));
      document.getElementById('loans-count').textContent = active.length ? `(${active.length})` : '';
      if (!active.length) {
        el.innerHTML = `<div class="empty">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <div>Нет активных кредитов</div>
        </div>`;
        return;
      }
      el.innerHTML = active.map(l => `
        <div class="card">
          <div class="card-row">
            <div>
              <div class="card-title">${formatMoney(l.amount)} USD</div>
              <div class="card-sub">Ставка ${l.interest_rate}% · ${l.term_days} дн.${l.remaining && l.status !== 'pending' ? ' · Остаток ' + formatMoney(l.remaining) : ''}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <span class="status-badge status-${l.status}">${statusLabel(l.status)}</span>
              ${['active','approved'].includes(l.status) ? `<button class="btn btn-sm btn-primary" onclick="openRepayModal(${l.id}, ${l.remaining})">Погасить</button>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function statusLabel(s) {
      return { pending: 'На рассмотрении', approved: 'Одобрен', active: 'Активный', rejected: 'Отклонён', repaid: 'Погашен' }[s] || s;
    }

    // ========== SCREENS ==========
    function showScreen(name) {
      ['home', 'history', 'loans', 'admin'].forEach(s => {
        document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
      });
      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.screen === name);
      });
      if (name === 'history') loadHistory();
      if (name === 'loans') loadAllLoans();
      if (name === 'admin') loadAdmin();
    }

    async function loadHistory() {
      const el = document.getElementById('tx-list');
      el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const txs = await api('/transactions');
        if (!txs.length) {
          el.innerHTML = '<div class="empty">История пуста</div>';
          return;
        }
        el.innerHTML = txs.map(t => `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">${txTypeLabel(t.type)}</div>
                <div class="card-sub">${new Date(t.created_at + 'Z').toLocaleString('ru-RU')} ${t.description ? '· ' + t.description : ''}</div>
              </div>
              <div class="${t.amount >= 0 ? 'amount-pos' : 'amount-neg'}">
                ${t.amount >= 0 ? '+' : ''}${formatMoney(t.amount)}
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty">Ошибка загрузки</div>';
      }
    }

    function txTypeLabel(t) {
      return {
        admin_adjust: 'Корректировка',
        loan_disburse: 'Выдача кредита',
        loan_repay: 'Погашение кредита',
        deposit: 'Пополнение',
        withdraw: 'Списание'
      }[t] || t;
    }

    async function loadAllLoans() {
      const el = document.getElementById('all-loans');
      el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const loans = await api('/loans');
        if (!loans.length) {
          el.innerHTML = '<div class="empty">Кредитов пока нет</div>';
          return;
        }
        el.innerHTML = loans.map(l => `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">#${l.id} · ${formatMoney(l.amount)} USD</div>
                <div class="card-sub">Ставка ${l.interest_rate}% · ${l.term_days} дн. ${l.due_date ? '· До ' + l.due_date : ''}</div>
                ${l.purpose ? `<div class="card-sub">${l.purpose}</div>` : ''}
              </div>
              <span class="status-badge status-${l.status}">${statusLabel(l.status)}</span>
            </div>
            ${['active','approved'].includes(l.status) ? `
              <div style="margin-top:12px">
                <div class="card-sub">Остаток к погашению: <strong style="color:var(--text)">${formatMoney(l.remaining)} USD</strong></div>
                <button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="openRepayModal(${l.id}, ${l.remaining})">Погасить</button>
              </div>
            ` : ''}
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    // ========== LOAN ==========
    function openLoanModal() {
      document.getElementById('loan-modal').classList.add('show');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    async function submitLoan() {
      const amount = document.getElementById('loan-amount').value;
      const term_days = document.getElementById('loan-term').value;
      const purpose = document.getElementById('loan-purpose').value;
      try {
        await api('/loans/request', {
          method: 'POST',
          body: JSON.stringify({ amount, term_days, purpose })
        });
        toast('Заявка отправлена!');
        closeModal('loan-modal');
        document.getElementById('loan-amount').value = '';
        document.getElementById('loan-purpose').value = '';
        await loadMe();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function openRepayModal(id, remaining) {
      currentLoanId = id;
      document.getElementById('repay-info').textContent = `Остаток долга: ${formatMoney(remaining)} USD`;
      document.getElementById('repay-amount').value = remaining;
      document.getElementById('repay-modal').classList.add('show');
    }

    async function submitRepay() {
      const amount = document.getElementById('repay-amount').value;
      try {
        const res = await api(`/loans/${currentLoanId}/repay`, {
          method: 'POST',
          body: JSON.stringify({ amount })
        });
        toast('Успешно погашено!');
        closeModal('repay-modal');
        await loadMe();
        if (document.getElementById('screen-loans').classList.contains('hidden') === false) loadAllLoans();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // ========== ADMIN ==========
    async function loadAdmin() {
      try {
        const stats = await api('/admin/stats');
        document.getElementById('admin-stats').innerHTML = `
          <div class="stat-card"><div class="stat-value">${stats.usersCount}</div><div class="stat-label">Пользователей</div></div>
          <div class="stat-card"><div class="stat-value">${formatMoney(stats.totalBalance)}</div><div class="stat-label">Общий баланс</div></div>
          <div class="stat-card"><div class="stat-value">${stats.pendingLoans}</div><div class="stat-label">Заявок</div></div>
          <div class="stat-card"><div class="stat-value">${stats.activeLoans}</div><div class="stat-label">Активных кредитов</div></div>
        `;
        await loadUsers();
        await loadPendingLoans();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function switchAdminTab(tab) {
      document.querySelectorAll('#screen-admin .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('admin-users').classList.toggle('hidden', tab !== 'users');
      document.getElementById('admin-loans').classList.toggle('hidden', tab !== 'loans');
    }

    async function loadUsers(q = '') {
      const el = document.getElementById('users-list');
      el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const users = await api('/admin/users' + (q ? '?q=' + encodeURIComponent(q) : ''));
        if (!users.length) {
          el.innerHTML = '<div class="empty">Никого не найдено</div>';
          return;
        }
        el.innerHTML = users.map(u => `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">${u.first_name || ''} ${u.last_name || ''} ${u.is_admin ? '👑' : ''}</div>
                <div class="card-sub">@${u.username || '—'} · ID ${u.id}</div>
                <div class="card-sub" style="margin-top:4px"><strong style="color:var(--text)">${formatMoney(u.balance)} USD</strong></div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <button class="btn btn-sm btn-primary" onclick="openAdjustModal(${u.id}, '${(u.first_name || u.username || u.id).replace(/'/g, '')}')">Баланс</button>
                <button class="btn btn-sm ${u.is_admin ? 'btn-danger' : 'btn-success'}" onclick="toggleAdmin(${u.id}, ${u.is_admin ? 0 : 1})">
                  ${u.is_admin ? 'Снять админа' : 'Сделать админом'}
                </button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    let searchTimeout;
    function searchUsers() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadUsers(document.getElementById('user-search').value);
      }, 300);
    }

    function openAdjustModal(userId, name) {
      currentAdjustUserId = userId;
      document.getElementById('adjust-user-info').textContent = `Пользователь: ${name} (ID ${userId})`;
      document.getElementById('adjust-amount').value = '';
      document.getElementById('adjust-reason').value = '';
      document.getElementById('adjust-modal').classList.add('show');
    }

    async function submitAdjust() {
      const amount = document.getElementById('adjust-amount').value;
      const reason = document.getElementById('adjust-reason').value;
      try {
        await api('/admin/adjust-balance', {
          method: 'POST',
          body: JSON.stringify({ user_id: currentAdjustUserId, amount, reason })
        });
        toast('Баланс изменён');
        closeModal('adjust-modal');
        loadUsers(document.getElementById('user-search').value);
        await loadMe();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function toggleAdmin(userId, isAdmin) {
      try {
        await api('/admin/set-admin', {
          method: 'POST',
          body: JSON.stringify({ user_id: userId, is_admin: isAdmin })
        });
        toast(isAdmin ? 'Назначен админом' : 'Снят с админов');
        loadUsers(document.getElementById('user-search').value);
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function loadPendingLoans() {
      const el = document.getElementById('pending-loans');
      el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const loans = await api('/admin/loans?status=pending');
        if (!loans.length) {
          el.innerHTML = '<div class="empty">Нет заявок на рассмотрении</div>';
          return;
        }
        el.innerHTML = loans.map(l => `
          <div class="card">
            <div class="card-row">
              <div>
                <div class="card-title">${formatMoney(l.amount)} USD · ${l.term_days} дн.</div>
                <div class="card-sub">${l.first_name || ''} ${l.last_name || ''} @${l.username || '—'} · ID ${l.user_id}</div>
                ${l.purpose ? `<div class="card-sub">${l.purpose}</div>` : ''}
                <div class="card-sub">${new Date(l.created_at + 'Z').toLocaleString('ru-RU')}</div>
              </div>
              <button class="btn btn-sm btn-primary" onclick="openApproveModal(${l.id}, ${l.amount}, ${l.interest_rate}, '${(l.first_name || '').replace(/'/g, '')}')">Решить</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty">Ошибка</div>';
      }
    }

    function openApproveModal(id, amount, rate, name) {
      currentApproveLoanId = id;
      document.getElementById('approve-info').textContent = `${name}: ${formatMoney(amount)} USD`;
      document.getElementById('approve-rate').value = rate;
      document.getElementById('approve-modal').classList.add('show');
    }

    async function decideLoan(action) {
      const interest_rate = document.getElementById('approve-rate').value;
      try {
        await api(`/admin/loans/${currentApproveLoanId}/decide`, {
          method: 'POST',
          body: JSON.stringify({ action, interest_rate })
        });
        toast(action === 'approve' ? 'Кредит одобрен и выдан' : 'Заявка отклонена');
        closeModal('approve-modal');
        loadPendingLoans();
        loadAdmin();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target === el) el.classList.remove('show');
      });
    });

    init();
  </script>
</body>
</html>
